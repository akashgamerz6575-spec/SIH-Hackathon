<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D ULPIN - Live Cadastral System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #070a12; font-family: ui-sans-serif, system-ui, sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        .glass { background: rgba(15, 23, 42, 0.90); backdrop-filter: blur(14px); border: 1px solid rgba(255, 255, 255, 0.12); }
    </style>
</head>
<body class="text-slate-100">

    <div id="canvas-container"></div>

    <!-- Header & Action Panel -->
    <header class="absolute top-4 left-4 z-10 glass rounded-xl p-4 shadow-2xl max-w-sm pointer-events-auto">
        <div class="flex items-center space-x-2">
            <span class="inline-block w-3 h-3 bg-emerald-400 rounded-full animate-pulse"></span>
            <h1 class="text-base font-bold tracking-wide text-white">GeoSpatial 3D ULPIN Engine</h1>
        </div>
        <p class="text-xs text-slate-400 mt-1">SIH26011 — Volumetric 3D Land Governance</p>
        
        <div class="mt-3 flex gap-2">
            <button onclick="seedUrbanComplex()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-1.5 px-3 rounded text-xs transition shadow-lg">
                ⚡ Seed 3D High-Rise Complex
            </button>
            <button onclick="fetchParcels()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 py-1.5 px-3 rounded text-xs transition border border-slate-700">
                Refresh
            </button>
        </div>
    </header>

    <!-- Side Inspector Panel -->
    <aside id="inspector-panel" class="absolute top-4 right-4 z-10 glass rounded-xl p-5 shadow-2xl w-96 max-w-md pointer-events-auto hidden">
        <div class="flex justify-between items-start border-b border-slate-700 pb-3">
            <div>
                <span class="text-[10px] tracking-wider uppercase font-semibold text-emerald-400">Volumetric Cadastre Record</span>
                <h2 id="parcel-name" class="text-lg font-bold text-white mt-0.5">Flat-101</h2>
            </div>
            <button onclick="closeInspector()" class="text-slate-400 hover:text-white text-sm font-bold bg-slate-800 rounded-full w-6 h-6 flex items-center justify-center">&times;</button>
        </div>

        <div class="mt-4 space-y-3 text-xs">
            <div>
                <label class="text-slate-400 block font-medium">Standardized 3D ULPIN</label>
                <div id="ulpin-code" class="font-mono text-xs bg-slate-900 text-emerald-400 p-2 rounded border border-slate-800 mt-1 break-all select-all font-semibold">
                    --
                </div>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div class="bg-slate-900/60 p-2 rounded border border-slate-800">
                    <span class="text-slate-400 block">Vertical Layer</span>
                    <span id="floor-level" class="font-semibold text-slate-200 text-sm">--</span>
                </div>
                <div class="bg-slate-900/60 p-2 rounded border border-slate-800">
                    <span class="text-slate-400 block">Z Elevation (MSL)</span>
                    <span id="elevation-range" class="font-semibold text-slate-200 text-sm">--</span>
                </div>
            </div>

            <div class="bg-slate-900/60 p-2 rounded border border-slate-800">
                <span class="text-slate-400 block">3D Volumetric Extent</span>
                <span id="parcel-volume" class="font-semibold text-slate-200">--</span>
            </div>

            <div class="border-t border-slate-700 pt-3">
                <h3 class="text-[11px] uppercase tracking-wider font-semibold text-slate-400 mb-2">Record of Rights (RoR)</h3>
                <div class="space-y-1.5">
                    <div class="flex justify-between"><span class="text-slate-400">Title Holder:</span><span id="owner-name" class="text-slate-200 font-medium">--</span></div>
                    <div class="flex justify-between"><span class="text-slate-400">Base Survey No:</span><span id="survey-no" class="text-slate-200 font-medium">--</span></div>
                    <div class="flex justify-between"><span class="text-slate-400">Encumbrance:</span><span class="text-emerald-400 font-medium">Clear / Validated</span></div>
                </div>
            </div>

            <button onclick="printCertificate()" class="w-full mt-3 bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2 rounded transition shadow-lg text-xs flex items-center justify-center gap-1.5">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                Export Digital 3D Title Certificate
            </button>
        </div>
    </aside>

    <script>
        const API_BASE = "http://127.0.0.1:8000/api";
        let scene, camera, renderer, controls, raycaster, mouse;
        const parcelMeshes = [];
        let selectedMesh = null;

        function init() {
            const container = document.getElementById("canvas-container");

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x070a12);
            scene.fog = new THREE.FogExp2(0x070a12, 0.012);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(28, 22, 32);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.95);
            dirLight.position.set(30, 50, 20);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // Ground Cadastral Boundary Grid
            const gridHelper = new THREE.GridHelper(60, 60, 0x10b981, 0x1e293b);
            gridHelper.position.y = 0.0;
            scene.add(gridHelper);

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            window.addEventListener('resize', onResize);
            window.addEventListener('pointerdown', onPointerDown);

            fetchParcels();
            animate();
        }

        async function fetchParcels() {
            try {
                const res = await fetch(`${API_BASE}/parcels`);
                const data = await res.json();
                renderParcels(data);
            } catch (err) {
                console.error("Backend not reachable:", err);
            }
        }

        async function seedUrbanComplex() {
            try {
                const res = await fetch(`${API_BASE}/seed-cadastre`, { method: "POST" });
                if (res.ok) fetchParcels();
            } catch (err) {
                alert("Failed to seed complex: " + err);
            }
        }

        function renderParcels(parcels) {
            parcelMeshes.forEach(m => scene.remove(m));
            parcelMeshes.length = 0;

            parcels.forEach(p => {
                const b = p.bounds;
                const width = b.max_x - b.min_x;
                const height = b.max_z - b.min_z;
                const depth = b.max_y - b.min_y;

                const posX = (b.min_x + b.max_x) / 2;
                const posY = (b.min_z + b.max_z) / 2;
                const posZ = (b.min_y + b.max_y) / 2;

                const geo = new THREE.BoxGeometry(width, height, depth);
                
                // Basements get deep purple; above-ground units get slate-blue
                const baseColor = p.floor_level < 0 ? 0x3730a3 : 0x1e293b;
                const mat = new THREE.MeshStandardMaterial({
                    color: baseColor,
                    roughness: 0.35,
                    metalness: 0.25,
                    transparent: true,
                    opacity: p.floor_level < 0 ? 0.70 : 0.85
                });

                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(posX, posY, posZ);

                const edges = new THREE.EdgesGeometry(geo);
                const edgeColor = p.floor_level < 0 ? 0x818cf8 : 0x38bdf8;
                mesh.add(new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: edgeColor })));

                mesh.userData = { ...p, defaultColor: baseColor };
                scene.add(mesh);
                parcelMeshes.push(mesh);
            });
        }

        function onPointerDown(event) {
            if (event.clientX < 420 && event.clientY < 200) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(parcelMeshes, false);

            if (intersects.length > 0) {
                selectParcel(intersects[0].object);
            }
        }

        function selectParcel(mesh) {
            if (selectedMesh) {
                selectedMesh.material.color.setHex(selectedMesh.userData.defaultColor);
            }
            selectedMesh = mesh;
            mesh.material.color.setHex(0x10b981);

            const p = mesh.userData;
            document.getElementById("inspector-panel").classList.remove("hidden");
            document.getElementById("parcel-name").innerText = p.unit_label;
            document.getElementById("ulpin-code").innerText = p.ulpin_3d;
            document.getElementById("floor-level").innerText = p.floor_level < 0 ? `Basement ${p.floor_level}` : `Floor ${p.floor_level}`;
            document.getElementById("elevation-range").innerText = `${p.bounds.min_z}m to ${p.bounds.max_z}m MSL`;
            document.getElementById("parcel-volume").innerText = `${p.volume_m3} m³`;
            document.getElementById("owner-name").innerText = p.owner_name;
            document.getElementById("survey-no").innerText = p.base_survey_no;
        }

        function closeInspector() {
            document.getElementById("inspector-panel").classList.add("hidden");
            if (selectedMesh) {
                selectedMesh.material.color.setHex(selectedMesh.userData.defaultColor);
                selectedMesh = null;
            }
        }

        function printCertificate() {
            if (!selectedMesh) return;
            const p = selectedMesh.userData;
            const printWin = window.open('', '', 'width=800,height=600');
            printWin.document.write(`
                <html>
                <head>
                    <title>Digital 3D Title Certificate - ${p.ulpin_3d}</title>
                    <style>
                        body { font-family: sans-serif; padding: 40px; color: #1e293b; }
                        .header { border-bottom: 2px solid #0f172a; padding-bottom: 12px; margin-bottom: 24px; text-align: center; }
                        .title { font-size: 22px; font-weight: bold; text-transform: uppercase; color: #0f172a; }
                        .subtitle { font-size: 13px; color: #64748b; margin-top: 4px; }
                        .box { border: 1px solid #cbd5e1; border-radius: 8px; padding: 20px; background: #f8fafc; margin-bottom: 20px; }
                        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; font-size: 14px; }
                        .code { font-family: monospace; font-size: 16px; font-weight: bold; color: #059669; }
                        .footer { font-size: 11px; text-align: center; color: #94a3b8; margin-top: 40px; border-top: 1px solid #e2e8f0; padding-top: 12px; }
                    </style>
                </head>
                <body>
                    <div class="header">
                        <div class="title">Ministry of Rural Development (DoLR)</div>
                        <div class="subtitle">Digital India Land Records Modernization Programme (DILRMP) — 3D Spatial Title Certificate</div>
                    </div>
                    <div class="box">
                        <div style="margin-bottom: 12px;"><strong>Unique Land Parcel Identification Number (3D ULPIN):</strong></div>
                        <div class="code">${p.ulpin_3d}</div>
                    </div>
                    <div class="grid">
                        <div><strong>Property Unit:</strong> ${p.unit_label}</div>
                        <div><strong>Title Holder:</strong> ${p.owner_name}</div>
                        <div><strong>Base Survey No:</strong> ${p.base_survey_no}</div>
                        <div><strong>Vertical Level:</strong> Floor ${p.floor_level}</div>
                        <div><strong>Elevation Span:</strong> ${p.bounds.min_z}m to ${p.bounds.max_z}m MSL</div>
                        <div><strong>3D Parcel Volume:</strong> ${p.volume_m3} m³</div>
                    </div>
                    <div class="footer">Generated cryptographically via ISO 19152 (LADM) Compliant 3D Cadastral Spatial Engine</div>
                </body>
                </html>
            `);
            printWin.document.close();
            printWin.print();
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
